# Gateway tunggal VEXA di dalam stack Docker/Coolify.
# Satu domain publik -> satu sertifikat, satu origin cookie/launch-token
# (sama seperti layout produksi Caddy: /viewer/Viewer, /mobile/...).
#
# PENTING: prefix /viewer dan /mobile TIDAK di-strip di sini. Kedua server viewer
# melakukan strip sendiri (index.mjs: pathname.replace(/^\/(viewer|mobile)(?=\/|$)/i,'')),
# jadi proxy_pass tanpa URI harus meneruskan path apa adanya.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;

    # ---------- health ----------
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- RIS API ----------
    location ^~ /api/ {
        proxy_pass http://ris-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- DICOMweb lewat gateway (STOW dari browser viewer) ----------
    location ^~ /dicom-web/ {
        proxy_pass http://ris-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- PACS QIDO/WADO ----------
    location = /rs {
        proxy_pass http://pacs:5001/rs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /rs/ {
        proxy_pass http://pacs:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /wadouri {
        proxy_pass http://pacs:5001/wadouri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ---------- Desktop diagnostic viewer (SSR 5994) ----------
    location ^~ /viewer/ {
        proxy_pass http://desktop-viewer:5994;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Mobile viewer (5992) ----------
    location ^~ /mobile/ {
        proxy_pass http://mobile-viewer:5992;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ---------- RIS SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
