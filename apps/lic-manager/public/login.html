<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VEXAPACS License Manager - Login">
  <title>VEXAPACS License Manager - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-bottom: 36px;
    }

    .login-logo-img {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      object-fit: contain;
    }

    .login-logo-text {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .login-logo-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
      display: block;
    }

    .login-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-title h1 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .login-title p {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .login-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--danger);
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .login-error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="/velo.png" alt="VEXAPACS" class="login-logo-img">
        <div>
          <div class="login-logo-text">VEXAPACS</div>
          <span class="login-logo-sub">License Manager</span>
        </div>
      </div>

      <div class="login-title">
        <h1>Welcome Back</h1>
        <p>Sign in to continue</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" id="username" type="text" placeholder="Enter your username" required autocomplete="username" style="font-size:1rem;padding:12px 16px;">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" type="password" placeholder="Enter your password" required autocomplete="current-password" style="font-size:1rem;padding:12px 16px;">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;justify-content:center;margin-top:8px;">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div> Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });

        const data = await res.json();

        if (data.ok) {
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.classList.add('show');
      }

      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    });
  </script>
</body>
</html>
